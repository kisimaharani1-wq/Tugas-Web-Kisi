<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 8 JavaScript</title>
</head>
<body>
    <h1 id="judul">Belajar DOM</h1>

    <p>paragraf 1 Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>

    <p>paragraf 2 Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>

    <h3 class="daftar">Daftar</h3>
    <ul>
        <li>Argentina</li>
        <li>America</li>
        <li>India</li>
        <li>Indonesia</li>
        <li>Belanda</li>
    </ul>

    <script>
        let judul=document.getElementById('judul');
        console.log(judul);

        let p=document.getElementsByTagName('p');
        console.log(p);

        let daftar=document.getElementsByClassName('daftar');
        console.log(daftar);

        let title=document.querySelector('#judul');
        console.log(title);

        let list=document.querySelectorAll('li');
        console.log(list);
    </script>
</body>
