<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 4 JavaScript</title>
</head>
<body>
    <h1>Tugas 4 JavaScript</h1>

    <script type="text/javascript">
        // membuat Array
        var siswa = ['Kai','Caleb','Elios','Alex'];
        console.log(siswa); //menampilkan semua data

        var harga = [1000, 2000, 5000, 3000];
        console.log(harga[3]); //menampilkan data indeks ke-3

        //merubah isi Array
        siswa[4]='Noesa';
        console.log(siswa);

        harga[1]=1500;
        console.log(harga);

        //menampilkan array dengan perulangan
        siswa.forEach(function(data){
            document.write('Nama Siswa adalah '+data+'<br>');
        });
    </script>
</body>
</html>
